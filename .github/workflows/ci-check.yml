name: CI build check

# Build-only smoke test for pull requests. Mirrors the build job in
# deploy.yml exactly — same Linux runner, same fonts, same toolchain —
# but without the deploy step. Confirms the site (including the
# glossary PDF) builds in the CI environment before merging to master.

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for git info

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended lmodern \
            texlive-lang-cjk texlive-lang-chinese \
            fonts-noto-cjk fonts-noto-cjk-extra \
            fonts-noto-core

      # TEMPORARY: remove once Greek-rendering fix is verified.
      - name: Debug font availability
        run: |
          echo "=== Greek-language fonts (fc-list :lang=el) ==="
          fc-list :lang=el | sort
          echo "=== Main-font fallback candidates ==="
          for f in "Times New Roman" "FreeSerif" "TeX Gyre Termes" "Latin Modern Roman" "Noto Serif" "GFS Didot" "Linux Libertine O"; do
            if fc-list | grep -q -i -F "$f"; then echo "AVAILABLE: $f"; else echo "MISSING:   $f"; fi
          done

      - name: Build Quartz
        run: npm run build

      - name: Upload glossary PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glossary-pdf
          path: content/dhamma/glossary.pdf
