name: CI build check

# The gate for pull requests. Runs the same composite action as deploy.yml, on
# the same Linux runner with the same fonts and toolchain, without the deploy
# step, so a PR that passes here will pass the deploy's build too.

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for git info

      - uses: ./.github/actions/site-gate

      - name: Upload glossary PDF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glossary-pdf
          path: public/dhamma/glossary.pdf
